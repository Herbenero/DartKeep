<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DartKeep</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      background: #111827;
      color: #e5e7eb;
    }
    header {
      background: #1f2937;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #374151;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    main {
      padding: 16px;
    }
    .card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
      text-align: center;
    }
    .card h2 {
      margin-top: 0;
      font-size: 18px;
    }
    #gameButtons {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      width: 100%;
      padding: 10px 0;
    }
    #gameButtons a {
      text-decoration: none;
      width: 100%;
    }
    #gameButtons button {
      width: 100%;
      padding: 12px 8px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #gameButtons button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex; align-items:center; gap:12px;">
      <img src="assets/dartkeep3.png" alt="DartKeep Logo" style="height:48px; width:auto;" />
      <h1 style="margin:0;">DartKeep</h1>
    </div>
  </header>
